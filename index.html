<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NovaStars MVP — Phiêu Lưu Học Kỹ Năng Sống</title>
  
  <!-- Design System CSS -->
  <link rel="stylesheet" href="styles.css">
</head>

  <script src="js/core/confetti.js"></script>
  <script src="js/core/particles.js"></script>
  <script src="js/core/state.js"></script>
  <script src="js/data/lesson0_data.js"></script>

  <script src="js/components/modals.js"></script>
  <script src="js/components/components.js"></script>

  <!-- Sub-Controller Scripts -->
  <script src="js/controllers/pretest_controller.js"></script>
  <script src="js/controllers/story_controller.js"></script>
  <script src="js/controllers/minigame_controller.js"></script>
  <script src="js/controllers/boss_controller.js"></script>
  <script src="js/controllers/reflection_controller.js"></script>

  <!-- Views & Application Orchestration -->
  <script src="js/views/views.js"></script>
  <script src="js/views/lesson_runner.js"></script>
