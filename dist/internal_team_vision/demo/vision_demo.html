<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NovaStars × NVS Championship — Shareable Pilot Demo v0.2.1</title>

  <!-- Design System CSS -->
  <link rel="stylesheet" href="../styles.css">

  <style>
    body {
      background: #0F172A;
      margin: 0;
      padding: 0;
      font-family: 'Nunito', sans-serif;
      overflow-x: hidden;
    }
    #app-root {
      width: 100%;
      max-width: 414px;
      margin: 0 auto;
      min-height: 100vh;
      background: #F8FAFC;
      position: relative;
      overflow-x: hidden;
      box-sizing: border-box;
      padding-bottom: 90px;
    }
    #app-view-container {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      box-sizing: border-box;
      min-width: 0;
    }
  </style>
</head>

  <script src="../js/views/championship_views.js"></script>
  <script src="../js/components/layout.js"></script>
  <script src="../js/components/cards.js"></script>
  <script src="../js/components/modals.js"></script>
  <script src="../js/components/components.js"></script>
  <script src="../js/views/views.js"></script>
