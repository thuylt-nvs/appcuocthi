name: novastars_mvp
description: "NovaStars MVP - Competency Learning Game Platform for Children"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management & Dependency Injection
  flutter_riverpod: ^2.4.9
  
  # Local Storage & Offline Persistence
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Declarative Router
  go_router: ^13.0.0
  
  # Audio & SFX Micro-Feedback
  audioplayers: ^5.2.1
  
  # Micro-Animations & Particle Effects
  flutter_animate: ^4.5.0
  lottie: ^3.0.0
  confetti: ^0.7.0
  
  # UI Vector & Asset Rendering
  flutter_svg: ^2.0.9
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/audio/
    - assets/characters/
    - assets/config/
    - assets/content/
    - assets/icons/
    - assets/images/
